# Pre-commit hooks — local, fast checks (no network after first hook install).
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        name: ruff (backend)
        args: [--fix]
        files: ^backend/
        types_or: [python, pyi]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        name: black (backend)
        language_version: python3.12
        files: ^backend/
        args: [--line-length=120]

  - repo: local
    hooks:
      # Requires frontend/node_modules (run npm ci in frontend once). No network if deps present.
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && if [ -d node_modules ]; then npm run lint --silent; else echo "skip eslint: frontend/node_modules missing"; fi'
        language: system
        files: ^frontend/
        pass_filenames: false
        stages: [pre-commit]
