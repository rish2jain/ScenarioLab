services:
  neo4j:
    image: neo4j:5.15-community
    container_name: scenariolab-neo4j
    # Host ports are not published by default (use docker-compose.override.yml for local UI).
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenariolab-backend
    ports:
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - ./backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 5001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scenariolab-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    environment:
      # Server-side proxy target (Docker network). Browser uses same-origin /api.
      - BACKEND_INTERNAL_URL=http://backend:5001
      # Keep empty / unset so the client does not bypass Next middleware.
      - NEXT_PUBLIC_API_URL=
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  neo4j_data:
  neo4j_logs:
